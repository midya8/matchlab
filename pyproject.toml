[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"
[project]
name = "matchlab-finite"
version = "0.1.0"
description = "Exact finite stable matching with independent evidence replay"
requires-python = ">=3.10"
license = {text="MIT"}
[project.scripts]
matchlab = "matchlab.__main__:main"
[tool.setuptools]
packages = ["matchlab"]
